<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Drywall Pro - Gestión y CAD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f0f2f5; }
        .canvas-wrapper { background-color: #ffffff; border: 2px dashed #adb5bd; border-radius: 8px; position: relative; height: 70vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #planoCanvas { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair; }
        .panel-herramientas { height: 70vh; overflow-y: auto; background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .draggable-item { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 10px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; cursor: grab; }
        .drag-icon { width: 40px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; }
        #toastAdvertencia { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background-color: rgba(220, 53, 69, 0.9); color: white; padding: 10px 20px; border-radius: 8px; z-index: 1000; display: none; }
        
        /* Estilos del Login */
        #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    
    <div id="loginScreen">
        <div class="login-card">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">ERP Drywall Pro</h3>
                <p class="text-muted small">Ingresa tus credenciales de acceso</p>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Correo Electrónico</label>
                <input type="email" id="txtEmail" class="form-control" placeholder="admin@techos.com">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">Contraseña</label>
                <input type="password" id="txtPassword" class="form-control" placeholder="••••••••">
            </div>
            <button onclick="iniciarSesion()" class="btn btn-primary w-100 fw-bold mb-2 py-2">Ingresar al Sistema</button>
            <div id="loginError" class="text-danger small text-center fw-bold mt-2" style="display: none;"></div>
        </div>
    </div>

    <div id="appWrapper" style="display: none;">
        <div id="toastAdvertencia">⚠️ El límite es el ángulo perimetral.</div>
        
        <div class="container-fluid px-4 mt-3">
            <div class="card shadow-sm p-3 border-0 mb-3 bg-white rounded-3">
                <div class="row g-2 align-items-center">
                    <div class="col-md-2 d-flex flex-column align-items-start">
                        <label class="small fw-bold">Largo (m):</label>
                        <input type="number" id="inputLargo" class="form-control" value="4.45" step="0.01">
                    </div>
                    <div class="col-md-2 d-flex flex-column align-items-start">
                        <label class="small fw-bold">Ancho (m):</label>
                        <input type="number" id="inputAncho" class="form-control" value="7.39" step="0.01">
                    </div>
                    <div class="col-md-2 d-flex flex-column align-items-start">
                        <label class="small fw-bold">Alambre (cm):</label>
                        <input type="number" id="inputAlambrePunto" class="form-control" value="20">
                    </div>
                    <div class="col-md-2 d-flex flex-column align-items-start">
                        <label class="small fw-bold">Precio x m² (S/):</label>
                        <input type="number" id="inputPrecioM2" class="form-control" value="30">
                    </div>
                    <div class="col-md-2 text-center bg-success text-white rounded p-2">
                        <small>TOTAL CLIENTE</small><br>
                        <strong id="totalClienteDisplay">S/ 0.00</strong>
                    </div>
                    <div class="col-md-2 d-flex flex-column gap-2">
                        <button onclick="calcularPresupuesto()" class="btn btn-primary w-100 fw-bold">Reflejar Plano</button>
                        <button onclick="cerrarSesion()" class="btn btn-outline-danger w-100 btn-sm">🚪 Cerrar Sesión</button>
                    </div>
                </div>
            </div>

            <div class="row g-3" id="areaTrabajo" style="display: none;">
                <div class="col-lg-8">
                    <div class="card shadow-sm p-2 border-0 bg-white mb-2 d-flex flex-row justify-content-between">
                        <h6 class="text-secondary mb-0 fw-bold">🗺️ Área de Diseño Visual <span class="small fw-normal">(Usa Scroll para Zoom)</span></h6>
                        <div>
                            <button onclick="forzarRotacionGrid()" class="btn btn-sm btn-outline-success me-2">🔄 Girar Perfiles</button>
                            <button onclick="guardarEnHistorial()" class="btn btn-sm btn-primary">📥 Guardar Historial</button>
                        </div>
                    </div>
                    <div class="canvas-wrapper" id="canvasContainer" ondrop="soltarObjeto(event)" ondragover="permitirSoltar(event)">
                        <canvas id="planoCanvas"></canvas>
                    </div>
                </div>
                <div class="col-lg-4">
                    <ul class="nav nav-tabs" id="myTab">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabCat">Catálogo</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMat">Materiales</button></li>
                        <li class="nav-item"><button class="nav-link text-success fw-bold" data-bs-toggle="tab" data-bs-target="#tabDist">Distribución</button></li>
                    </ul>
                    <div class="tab-content panel-herramientas">
                        <div class="tab-pane fade show active" id="tabCat"><div id="contenedorCatalogo"></div></div>
                        <div class="tab-pane fade" id="tabMat">
                            <table class="table table-sm table-bordered" style="font-size:11px">
                                <thead class="table-dark"><tr><th>Material</th><th>Total</th><th>Detalle Cortes</th></tr></thead>
                                <tbody id="tablaResultados"></tbody>
                            </table>
                            <div class="bg-light p-2 rounded border mt-3">
                                <h6 class="text-success fw-bold text-center">🛒 Costo Materiales</h6>
                                <div id="cuerpoCotizador"></div>
                                <div class="border-top pt-2 mt-2 fw-bold d-flex justify-content-between">
                                    <span>TOTAL:</span> <span class="text-danger">S/ <span id="granTotal">0.00</span></span>
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="tabDist"><div id="cuerpoDistribucion"></div></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="modal fade" id="modalEdicionCatalogo" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-warning text-dark py-2">
                        <h5 class="modal-title fs-6 fw-bold">✏️ Configurar Accesorio del Catálogo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body row g-2">
                        <input type="hidden" id="catEditId">
                        <div class="col-12"><label class="small fw-bold">Nombre:</label><input type="text" id="catEditNombre" class="form-control"></div>
                        <div class="col-6"><label class="small fw-bold">Tamaño (cm):</label><input type="number" id="catEditSize" class="form-control"></div>
                        <div class="col-6"><label class="small fw-bold text-success">Precio Cliente (S/):</label><input type="number" id="catEditPrecio" class="form-control text-success fw-bold" step="0.1"></div>
                        <div class="col-6"><label class="small fw-bold">Watts:</label><input type="text" id="catEditWatts" class="form-control"></div>
                        <div class="col-6"><label class="small fw-bold">Marca:</label><input type="text" id="catEditMarca" class="form-control"></div>
                    </div>
                    <div class="modal-footer py-2 bg-light">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary btn-sm fw-bold" onclick="guardarEdicionCatalogo()">💾 Actualizar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalEdicion" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white py-2"><h5 class="modal-title fs-6">✏️ Objeto en Techo</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-danger btn-sm" onclick="eliminarObjeto()">🗑️ Eliminar</button>
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
